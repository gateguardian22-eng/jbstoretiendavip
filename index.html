<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JBstore VIP — Gacha Experience</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --accent-color: #10b981;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 40px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: rgba(15, 23, 42, 0.9);
      border-bottom: 2px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .logo-vip { font-size: 20px; font-weight: 900; color: var(--accent-color); }

    .admin-btn {
      background: #1e293b;
      border: 2px solid var(--accent-color);
      color: var(--accent-color);
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }

    .app-layout {
      display: flex;
      max-width: 1100px;
      margin: 0 auto;
      width: 100%;
      padding: 16px;
      gap: 20px;
    }

    .sidebar { width: 280px; display: flex; flex-direction: column; align-items: center; }

    .dialogue-box {
      background: #ffffff;
      color: #0f172a;
      border: 2px solid var(--accent-color);
      border-radius: 12px;
      padding: 10px;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 10px;
      width: 100%;
      min-height: 48px;
    }

    .character-img {
      width: 200px;
      height: 240px;
      object-fit: contain;
      cursor: pointer;
    }

    .tabs-vertical { width: 100%; display: flex; flex-direction: column; gap: 8px; }

    .tab-item {
      padding: 12px;
      background: #1e293b;
      border: 2px solid var(--border-color);
      border-radius: 10px;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      color: #fff;
      text-align: left;
    }
    .tab-item.active { background: var(--accent-color); border-color: var(--accent-color); }

    .shop-frame {
      flex: 1;
      background: rgba(30, 41, 59, 0.7);
      border: 2px solid var(--border-color);
      border-radius: 16px;
      padding: 16px;
    }

    .shop-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
    }

    .gacha-card {
      background: #0f172a;
      border: 2px solid var(--border-color);
      border-radius: 10px;
      padding: 8px;
      text-align: center;
      cursor: pointer;
    }
    .gacha-card:hover { border-color: var(--accent-color); }

    .gacha-img {
      width: 100%;
      height: 100px;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 6px;
    }

    .gacha-title {
      font-size: 12px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .gacha-price-bar {
      background: var(--accent-color);
      color: #fff;
      padding: 6px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 900;
    }

    /* MODAL */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .modal-gacha {
      background: #1e293b;
      border: 2px solid var(--accent-color);
      border-radius: 16px;
      max-width: 400px;
      width: 100%;
      padding: 20px;
      color: #fff;
    }

    .buy-btn {
      width: 100%;
      padding: 10px;
      background: var(--accent-color);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 10px;
    }

    @media (max-width: 768px) {
      .app-layout { flex-direction: column; }
      .sidebar { width: 100%; }
      .tabs-vertical { flex-direction: row; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-vip">✨ JBstore VIP</div>
    <button class="admin-btn" onclick="openModal('admin-modal')">⚙️ Admin</button>
  </header>

  <div class="app-layout">
    <div class="sidebar">
      <div class="dialogue-box" id="character-text">¡Hola! ¿Qué se te antoja hoy? ✨ ¡Los mejores precios VIP!</div>
      <img src="img/avatar/gesto1.png" class="character-img" id="mascot" onclick="talkMascot()" alt="Avatar">
      
      <div class="tabs-vertical" style="margin-top: 12px;">
        <button class="tab-item active" onclick="switchCategory('Juegos', this)">🎮 Juegos</button>
        <button class="tab-item" onclick="switchCategory('Streaming', this)">📺 Streaming</button>
        <button class="tab-item" onclick="switchCategory('Licencias', this)">🔑 Licencias</button>
      </div>
    </div>

    <div class="shop-frame">
      <div class="shop-grid" id="shop-grid"></div>
    </div>
  </div>

  <!-- MODAL COMPRA -->
  <div class="modal-overlay" id="modal-buy">
    <div class="modal-gacha">
      <h3 id="modal-title" style="text-align: center; margin-bottom: 8px;">--</h3>
      <p id="modal-desc" style="font-size: 12px; color: var(--text-muted); margin-bottom: 12px; text-align: center;">--</p>
      
      <div style="text-align: center; margin-bottom: 12px;">
        <label style="font-size: 11px; display: block; margin-bottom: 4px;">OPCIÓN / PRECIO:</label>
        <select id="modal-variant-select" style="width: 100%; padding: 8px; border-radius: 6px; background: #0f172a; color: #fff; border: 1px solid var(--border-color);"></select>
      </div>

      <button class="buy-btn" onclick="confirmOrder()">📲 Confirmar por WhatsApp</button>
      <button class="buy-btn" style="background: #334155;" onclick="closeModal('modal-buy')">Cancelar</button>
    </div>
  </div>

  <!-- MODAL ADMIN -->
  <div class="modal-overlay" id="admin-modal">
    <div class="modal-gacha">
      <h3 style="margin-bottom: 12px;">⚙️ Admin</h3>
      <input type="password" id="admin-pin" placeholder="Ingresa PIN (24.07.12)" style="width: 100%; padding: 8px; margin-bottom: 10px; border-radius: 6px;">
      <button class="buy-btn" onclick="authAdmin()">Ingresar</button>
      <button class="buy-btn" style="background: #334155;" onclick="closeModal('admin-modal')">Cerrar</button>
      
      <div id="admin-body" style="display: none; margin-top: 15px;">
        <p style="font-size: 12px; color: #10b981; margin-bottom: 10px;">¡Sesión iniciada correctamente!</p>
        <button class="buy-btn" style="background: #ef4444;" onclick="resetApp()">🧹 Resetear Memoria Completa</button>
      </div>
    </div>
  </div>

  <script>
    const PHONE = "58412546526";

    const defaultData = {
      tasaBs: 1047,
      productos: [
        {
          id: "roblox-1",
          categoria: "Juegos",
          titulo: "RECARGA ROBLOX",
          priceText: "🎟️ 1 TOKEN",
          desc: "Canjea 1 Token + $4.99 USDT (O $6.00 sin token). Entrega vía ID.",
          img: "img/avatar/gesto1.png",
          variantes: [{ nombre: "Canje con 1 Token", usdt: 4.99 }, { nombre: "Precio Regular", usdt: 6.00 }]
        },
        {
          id: "codm-1",
          categoria: "Juegos",
          titulo: "CALL OF DUTY MOBILE",
          priceText: "🎟️ 1 TOKEN",
          desc: "COD Points directos a tu cuenta.",
          img: "img/avatar/gesto3.png",
          variantes: [{ nombre: "80 COD Points", usdt: 1.25 }]
        }
      ]
    };

    let storeData = defaultData;
    let currentCategory = "Juegos";
    let selectedProd = null;

    function renderShop(cat) {
      const grid = document.getElementById('shop-grid');
      grid.innerHTML = '';
      const list = storeData.productos.filter(p => p.categoria === cat);

      if (list.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 20px;">Sin productos en esta categoría</div>`;
        return;
      }

      list.forEach(p => {
        grid.innerHTML += `
          <div class="gacha-card" onclick="openBuyModal('${p.id}')">
            <img src="${p.img}" class="gacha-img" onerror="this.src='img/avatar/gesto1.png'">
            <div class="gacha-title">${p.titulo}</div>
            <div class="gacha-price-bar">${p.priceText}</div>
          </div>
        `;
      });
    }

    function switchCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab-item').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderShop(cat);
    }

    function openBuyModal(id) {
      selectedProd = storeData.productos.find(p => p.id === id);
      document.getElementById('modal-title').innerText = selectedProd.titulo;
      document.getElementById('modal-desc').innerText = selectedProd.desc;
      
      const sel = document.getElementById('modal-variant-select');
      sel.innerHTML = selectedProd.variantes.map(v => `<option value="${v.usdt}">${v.nombre} - ${v.usdt} USDT</option>`).join('');
      
      openModal('modal-buy');
    }

    function confirmOrder() {
      const sel = document.getElementById('modal-variant-select');
      const opt = sel.options[sel.selectedIndex].text;
      const msg = `🌟 *PEDIDO JBstore VIP*\n\n📌 *Producto:* ${selectedProd.titulo}\n🔹 *Opción:* ${opt}`;
      window.open(`https://wa.me/${PHONE}?text=${encodeURIComponent(msg)}`, '_blank');
      closeModal('modal-buy');
    }

    function talkMascot() {
      const msgs = [
        "¡Hola! ¿Qué se te antoja hoy? ✨",
        "¡Los mejores pases están aquí!",
        "¿Buscabas algo especial? Dime de una."
      ];
      document.getElementById('character-text').innerText = msgs[Math.floor(Math.random() * msgs.length)];
    }

    function authAdmin() {
      if (document.getElementById('admin-pin').value === "24.07.12") {
        document.getElementById('admin-body').style.display = 'block';
      } else { alert("PIN Incorrecto"); }
    }

    function resetApp() {
      localStorage.clear();
      location.reload();
    }

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    // Inicializar
    renderShop('Juegos');
  </script>
</body>
</html>
