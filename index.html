<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JBstore VIP — Gacha Anime Experience</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
      --accent-color: #16a34a;
      --accent-hover: #15803d;
      --card-bg: rgba(255, 255, 255, 0.95);
      --border-color: #bbf7d0;
      --text-main: #064e3b;
      --text-muted: #374151;
      --danger: #dc2626;
      --primary: #111827;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 80px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      border-bottom: 2px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .logo-vip { font-size: 20px; font-weight: 900; color: var(--accent-color); letter-spacing: 1px; }
    .header-btns { display: flex; gap: 8px; align-items: center; }

    .sound-btn, .admin-btn {
      background: #ffffff;
      border: 2px solid var(--accent-color);
      color: var(--accent-color);
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .sound-btn:hover, .admin-btn:hover { background: var(--accent-color); color: #fff; }

    .app-layout {
      display: flex;
      flex: 1;
      max-width: 1100px;
      margin: 0 auto;
      width: 100%;
      padding: 16px;
      gap: 20px;
    }

    .sidebar {
      width: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .character-container {
      position: relative;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 16px;
    }

    .dialogue-box {
      background: #ffffff;
      border: 2px solid var(--accent-color);
      border-radius: 16px;
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      position: relative;
      margin-bottom: 12px;
      box-shadow: 0 4px 12px rgba(22, 163, 74, 0.15);
      width: 100%;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .dialogue-box::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 10px 10px 0;
      border-style: solid;
      border-color: #ffffff transparent;
      display: block;
      width: 0;
    }

    .character-img {
      width: 220px;
      height: 260px;
      object-fit: contain;
      cursor: pointer;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.1));
      transition: transform 0.15s ease-in-out;
    }
    .character-img:active { transform: scale(0.95); }

    .tabs-vertical {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .tab-item {
      padding: 12px 16px;
      background: #ffffff;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-main);
    }
    .tab-item.active {
      background: var(--accent-color);
      color: #ffffff;
      border-color: var(--accent-color);
      transform: translateX(6px);
      box-shadow: 0 4px 12px rgba(22, 163, 74, 0.3);
    }

    .shop-area {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
      align-content: start;
    }

    .item-card {
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 16px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .item-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      border-color: var(--accent-color);
    }

    .stock-tag {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 6px;
      z-index: 2;
    }

    .item-img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 8px;
      background: #e5e7eb;
    }

    .item-title { font-size: 14px; font-weight: 800; margin-bottom: 4px; color: var(--primary); }
    .item-desc { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; }
    .item-price { font-size: 15px; font-weight: 900; color: var(--accent-color); margin-bottom: 10px; }

    .buy-btn {
      width: 100%;
      padding: 10px;
      background: var(--accent-color);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.2s;
    }
    .buy-btn:hover { background: var(--accent-hover); }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 16px;
      overflow-y: auto;
    }

    .modal-gacha {
      background: #ffffff;
      border: 3px solid var(--accent-color);
      border-radius: 20px;
      max-width: 480px;
      width: 100%;
      padding: 20px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.25);
      position: relative;
    }

    .modal-banner-img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 12px;
      border: 1px solid var(--border-color);
    }

    .field-group { margin-bottom: 12px; text-align: left; }
    .field-group label { display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; }

    select, input, textarea {
      width: 100%; padding: 10px; font-size: 13px;
      border: 1px solid var(--border-color); border-radius: 8px;
      background: #f9fafb; color: #111827; outline: none;
    }

    .modal-qty-control {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin: 16px 0;
    }

    .qty-btn-gacha {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 2px solid var(--accent-color);
      background: #fff; color: var(--accent-color);
      font-size: 18px; font-weight: 900; cursor: pointer;
    }

    .admin-nav-tabs {
      display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto;
    }
    .admin-tab-btn {
      padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border-color);
      background: #f3f4f6; font-size: 11px; font-weight: 700; cursor: pointer;
    }
    .admin-tab-btn.active { background: var(--accent-color); color: #fff; border-color: var(--accent-color); }

    @media (max-width: 768px) {
      .app-layout { flex-direction: column; }
      .sidebar { width: 100%; }
      .character-img { height: 180px; }
      .tabs-vertical { flex-direction: row; overflow-x: auto; }
      .tab-item { flex: 0 0 auto; }
    }
  </style>
</head>
<body>

  <audio id="bgm" loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3" type="audio/mp3">
  </audio>

  <header>
    <div class="logo-vip">✨ JBstore VIP</div>
    <div class="header-btns">
      <button class="sound-btn" onclick="toggleAudio()" id="audio-toggle">🔊 Música: OFF</button>
      <button class="admin-btn" onclick="openModal('admin-modal')">⚙️ Admin</button>
    </div>
  </header>

  <div class="app-layout">
    <div class="sidebar">
      <div class="character-container">
        <div class="dialogue-box" id="character-text">¡Hola! ¿Qué se te antoja hoy? ✨ ¡Los mejores precios VIP!</div>
        <img src="img/avatar/gesto1.png" class="character-img" id="mascot" onclick="talkMascot()" alt="Mascota JBstore VIP">
      </div>

      <div class="tabs-vertical">
        <button class="tab-item active" onclick="switchCategory('Juegos', this)">🎮 Juegos</button>
        <button class="tab-item" onclick="switchCategory('Streaming', this)">📺 Streaming</button>
        <button class="tab-item" onclick="switchCategory('Licencias', this)">🔑 Licencias</button>
      </div>
    </div>

    <div class="shop-area" id="shop-grid"></div>
  </div>

  <!-- MODAL DE COMPRA EXTENDIDO CON IMAGEN Y DESCRIPCIÓN -->
  <div class="modal-overlay" id="modal-buy">
    <div class="modal-gacha">
      <img id="modal-img-banner" src="" class="modal-banner-img" alt="Detalle del producto">
      <h3 id="modal-title" style="margin-bottom: 6px; text-align: center;">--</h3>
      <p style="font-size: 12px; color: var(--text-muted); text-align: center; margin-bottom: 12px; line-height: 1.4;" id="modal-desc">--</p>

      <div class="field-group">
        <label>Selecciona Opción / Variante:</label>
        <select id="modal-variant-select" onchange="updateModalTotal()"></select>
      </div>

      <div class="modal-qty-control">
        <button class="qty-btn-gacha" onclick="adjustQty(-1)">-</button>
        <span style="font-size: 20px; font-weight: 900;" id="modal-qty">1</span>
        <button class="qty-btn-gacha" onclick="adjustQty(1)">+</button>
      </div>

      <div style="text-align: center; margin-bottom: 16px;">
        <div style="font-size: 20px; font-weight: 900; color: var(--accent-color);" id="modal-total-usdt">0.00 USDT</div>
        <div style="font-size: 13px; font-weight: 700; color: #15803d;" id="modal-total-bs">~ 0.00 BS</div>
      </div>

      <div class="field-group">
        <label>Datos para procesar tu recarga / cuenta:</label>
        <textarea id="client-account-data" rows="2" placeholder="Ej: ID de jugador, Usuario o Correo y Clave"></textarea>
      </div>

      <div style="display: flex; gap: 10px;">
        <button class="buy-btn" onclick="confirmVipOrder()">📲 Confirmar Pedido por WhatsApp</button>
        <button class="buy-btn" style="background: #e2e8f0; color: #333;" onclick="closeModal('modal-buy')">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- MODAL PANEL ADMIN PRO -->
  <div class="modal-overlay" id="admin-modal">
    <div class="modal-gacha" style="max-width: 520px; max-height: 90vh; overflow-y: auto;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h3>⚙️ Panel Administrador Pro</h3>
        <button onclick="closeModal('admin-modal')" style="background:none; border:none; font-size:20px; cursor:pointer;">&times;</button>
      </div>

      <div id="admin-auth">
        <div class="field-group">
          <label>PIN de Acceso:</label>
          <input type="password" id="admin-pin" placeholder="Ingresa PIN (Clave: 24.07.12)">
        </div>
        <button class="buy-btn" onclick="authAdmin()">Ingresar</button>
      </div>

      <div id="admin-body" style="display: none;">
        <h4 style="margin-bottom: 8px;">1. Tasa y Configuración General</h4>
        <div class="field-group">
          <label>Tasa BS / USDT:</label>
          <input type="number" step="0.01" id="admin-tasa">
        </div>
        <button class="buy-btn" style="margin-bottom: 16px;" onclick="saveGeneralSettings()">Guardar Tasa</button>

        <hr style="margin: 16px 0; border: none; border-top: 1px solid var(--border-color);">

        <h4 style="margin-bottom: 8px;">2. Gestión de Productos por Categoría</h4>
        <div class="admin-nav-tabs">
          <button class="admin-tab-btn active" onclick="filterAdminCategory('Juegos', this)">🎮 Juegos</button>
          <button class="admin-tab-btn" onclick="filterAdminCategory('Streaming', this)">📺 Streaming</button>
          <button class="admin-tab-btn" onclick="filterAdminCategory('Licencias', this)">🔑 Licencias</button>
        </div>

        <div class="field-group">
          <label>Seleccionar Producto para Editar:</label>
          <select id="edit-prod-select" onchange="loadProductToEdit()">
            <option value="NEW">➕ -- CREAR NUEVO PRODUCTO --</option>
          </select>
        </div>

        <div class="field-group">
          <label>Título del Producto:</label>
          <input type="text" id="prod-title" placeholder="Ej: Roblox — Robux">
        </div>
        <div class="field-group">
          <label>Descripción Corta (En la tarjeta):</label>
          <input type="text" id="prod-desc-short" placeholder="Ej: Recarga directa por ID">
        </div>
        <div class="field-group">
          <label>Descripción Larga (Al abrir para comprar):</label>
          <textarea id="prod-desc-long" rows="2" placeholder="Ej: Entrega de 5 a 15 mins. No requiere contraseña."></textarea>
        </div>
        <div class="field-group">
          <label>URL Imagen Tarjeta Principal:</label>
          <input type="text" id="prod-img-card" placeholder="URL Imagen Tarjeta">
        </div>
        <div class="field-group">
          <label>URL Imagen Detalle Modal (Afiche/Banner):</label>
          <input type="text" id="prod-img-modal" placeholder="URL Afiche Explicativo">
        </div>
        <div class="field-group">
          <label>Variantes (Formato: Opción:PrecioUSDT separado por coma):</label>
          <input type="text" id="prod-variants" placeholder="Ej: 80 Robux:1.27, 500 Robux:5.90">
        </div>

        <div style="display: flex; gap: 8px; margin-bottom: 16px;">
          <button class="buy-btn" style="background: #16a34a;" id="btn-save-prod" onclick="saveProduct()">Guardar Producto</button>
          <button class="buy-btn" style="background: #dc2626; display: none;" id="btn-delete-prod" onclick="deleteProduct()">Eliminar</button>
        </div>

        <hr style="margin: 16px 0; border: none; border-top: 1px solid var(--border-color);">

        <h4 style="margin-bottom: 8px;">6. Personalización del Avatar VIP (10 Gestos)</h4>
        <div class="field-group"><label>1. Bienvenida (Saludo):</label><input type="text" id="avatar-img-0"><input type="text" id="avatar-text-0" style="margin-top:4px;"></div>
        <div class="field-group"><label>2. Pensativa:</label><input type="text" id="avatar-img-1"><input type="text" id="avatar-text-1" style="margin-top:4px;"></div>
        <div class="field-group"><label>3. Entusiasmada (Juegos):</label><input type="text" id="avatar-img-2"><input type="text" id="avatar-text-2" style="margin-top:4px;"></div>
        <div class="field-group"><label>4. Sorprendida (Ofertas):</label><input type="text" id="avatar-img-3"><input type="text" id="avatar-text-3" style="margin-top:4px;"></div>
        <div class="field-group"><label>5. Guiño (Streaming):</label><input type="text" id="avatar-img-4"><input type="text" id="avatar-text-4" style="margin-top:4px;"></div>
        <div class="field-group"><label>6. Apenada (Stock):</label><input type="text" id="avatar-img-5"><input type="text" id="avatar-text-5" style="margin-top:4px;"></div>
        <div class="field-group"><label>7. Agradecida (Modal Compra):</label><input type="text" id="avatar-img-6"><input type="text" id="avatar-text-6" style="margin-top:4px;"></div>
        <div class="field-group"><label>8. Victoria (WhatsApp):</label><input type="text" id="avatar-img-7"><input type="text" id="avatar-text-7" style="margin-top:4px;"></div>
        <div class="field-group"><label>9. Explicativa (Licencias):</label><input type="text" id="avatar-img-8"><input type="text" id="avatar-text-8" style="margin-top:4px;"></div>
        <div class="field-group"><label>10. Feliz / Despedida:</label><input type="text" id="avatar-img-9"><input type="text" id="avatar-text-9" style="margin-top:4px;"></div>

        <button class="buy-btn" style="background: #2563eb; margin-bottom: 16px;" onclick="saveAvatarSettings()">Guardar Configuración Avatar</button>

        <hr style="margin: 16px 0; border: none; border-top: 1px solid var(--border-color);">

        <h4 style="margin-bottom: 8px;">Respaldos (Exportar / Importar)</h4>
        <div style="display: flex; gap: 8px;">
          <button class="buy-btn" style="background: #3b82f6;" onclick="exportData()">📥 Exportar JSON</button>
          <button class="buy-btn" style="background: #8b5cf6;" onclick="triggerImport()">📤 Importar JSON</button>
          <input type="file" id="import-file" style="display: none;" accept=".json" onchange="importData(event)">
        </div>
      </div>
    </div>
  </div>

  <script>
    const PHONE_NUMBER = "58412546526";

    const initialData = {
      tasaBs: 1047,
      pagoMovil: "Banco Mercantil | 0414-3633915 | V-17545455",
      binanceId: "246763246 (JBstore)",
      estadoAtencion: "ONLINE",
      avatarConfig: [
        { img: "img/avatar/gesto1.png", text: "¡Hola! ¿Qué se te antoja hoy? ✨ ¡Los mejores precios VIP!" },
        { img: "img/avatar/gesto2.png", text: "¿Buscabas algo especial? Dime y lo resolvemos de una." },
        { img: "img/avatar/gesto3.png", text: "¡Los mejores pases y recargas están aquí! Calidad 100% garantizada. 🎯" },
        { img: "img/avatar/gesto4.png", text: "¡Wao, esa oferta está brutal! No te la pienses mucho." },
        { img: "img/avatar/gesto5.png", text: "¿Tarde de películas o series? Tengo las mejores pantallas activas. 🍿" },
        { img: "img/avatar/gesto6.png", text: "¡Oops! Déjame revisar el stock... ¡A veces las recargas vuelan! 😅" },
        { img: "img/avatar/gesto7.png", text: "¡Gracias por preferirnos! Tu apoyo vale oro para JBstore. 🩵" },
        { img: "img/avatar/gesto8.png", text: "¡Pedido listo! Te veo en WhatsApp para entregártelo volando. 📲💨" },
        { img: "img/avatar/gesto9.png", text: "¿Licencias activas para tus consolas o PC? Todo 100% legal y seguro. 🔑" },
        { img: "img/avatar/gesto10.png", text: "¡Vuelve pronto! Aquí estaremos esperándote con más promos." }
      ],
      productos: [
        {
          id: "1",
          categoria: "Juegos",
          titulo: "Roblox — Robux",
          descShort: "Recarga Vía acceso",
          descLong: "Recargas rápidas y seguras a tu cuenta de Roblox. Entrega promedio de 5 a 15 minutos en nuestro horario activo.",
          imgCard: "https://lh3.googleusercontent.com/d/1QZieXFAfc8Hcyjht7Qxb-FtdOhoDJaon",
          imgModal: "https://lh3.googleusercontent.com/d/1QZieXFAfc8Hcyjht7Qxb-FtdOhoDJaon",
          variantes: [
            { nombre: "80 Robux", usdt: 1.27 },
            { nombre: "500 Robux", usdt: 5.9 },
            { nombre: "1000 Robux", usdt: 11.8 }
          ]
        },
        {
          id: "1791774483508",
          categoria: "Juegos",
          titulo: "Call of Duty Mobile",
          descShort: "Recarga Via acceso",
          descLong: "Acredita COD Points a tu cuenta de Activision de forma segura para pases de batalla y ruletas.",
          imgCard: "https://lh3.googleusercontent.com/d/1jajT3d5s0q1f_tkUCMSsP_89Vb73yWub",
          imgModal: "https://lh3.googleusercontent.com/d/1jajT3d5s0q1f_tkUCMSsP_89Vb73yWub",
          variantes: [
            { nombre: "80 CodP", usdt: 1.25 },
            { nombre: "420 CodP", usdt: 6 },
            { nombre: "880 CodP", usdt: 11.8 },
            { nombre: "2400 CodP", usdt: 25.9 },
            { nombre: "5000 CodP", usdt: 52.5 }
          ]
        }
      ]
    };

    let localRaw = localStorage.getItem('jbstore_vip_data');
    let storeData = localRaw ? JSON.parse(localRaw) : initialData;

    let isAudioPlaying = false;
    let currentQty = 1;
    let selectedProduct = null;
    let currentCategory = "Juegos";
    let adminCategory = "Juegos";
    let lastGestureIndex = -1;

    function saveToStorage() {
      localStorage.setItem('jbstore_vip_data', JSON.stringify(storeData));
      renderShop(currentCategory);
    }

    function toggleAudio() {
      const audio = document.getElementById('bgm');
      const btn = document.getElementById('audio-toggle');
      if (isAudioPlaying) {
        audio.pause();
        btn.innerText = "🔊 Música: OFF";
      } else {
        audio.play().catch(() => alert("Toca la pantalla para autorizar el sonido."));
        btn.innerText = "🎶 Música: ON";
      }
      isAudioPlaying = !isAudioPlaying;
    }

    function talkMascot() {
      if (!storeData.avatarConfig || storeData.avatarConfig.length === 0) return;
      
      let randomIndex;
      do {
        randomIndex = Math.floor(Math.random() * storeData.avatarConfig.length);
      } while (randomIndex === lastGestureIndex && storeData.avatarConfig.length > 1);

      lastGestureIndex = randomIndex;
      const g = storeData.avatarConfig[randomIndex];

      document.getElementById('character-text').innerText = g.text;
      if (g.img) document.getElementById('mascot').src = g.img;
    }

    function switchCategory(cat, element) {
      currentCategory = cat;
      document.querySelectorAll('.tab-item').forEach(b => b.classList.remove('active'));
      if (element) element.classList.add('active');
      talkMascot();
      renderShop(cat);
    }

    function renderShop(cat) {
      const grid = document.getElementById('shop-grid');
      grid.innerHTML = '';

      const filtered = storeData.productos.filter(p => p.categoria === cat);

      if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; padding: 32px; color: var(--text-muted);">Sin artículos en esta categoría aún.</div>`;
        return;
      }

      filtered.forEach(p => {
        let minPrice = p.variantes[0].usdt;
        grid.innerHTML += `
          <div class="item-card">
            <div>
              <span class="stock-tag">Disponible</span>
              <img src="${p.imgCard}" class="item-img" alt="${p.titulo}">
              <div class="item-title">${p.titulo}</div>
              <div class="item-desc">${p.descShort || ''}</div>
            </div>
            <div>
              <div class="item-price">Desde ${minPrice.toFixed(2)} USDT</div>
              <button class="buy-btn" onclick="openBuyModal('${p.id}')">Seleccionar</button>
            </div>
          </div>
        `;
      });
    }

    function openBuyModal(prodId) {
      selectedProduct = storeData.productos.find(p => p.id === prodId);
      currentQty = 1;
      document.getElementById('modal-title').innerText = selectedProduct.titulo;
      document.getElementById('modal-desc').innerText = selectedProduct.descLong || selectedProduct.descShort || '';
      document.getElementById('modal-img-banner').src = selectedProduct.imgModal || selectedProduct.imgCard;

      const sel = document.getElementById('modal-variant-select');
      sel.innerHTML = selectedProduct.variantes.map(v => `<option value="${v.usdt}">${v.nombre} — ${v.usdt.toFixed(2)} USDT</option>`).join('');

      if (storeData.avatarConfig && storeData.avatarConfig[6]) {
        document.getElementById('character-text').innerText = storeData.avatarConfig[6].text;
        if (storeData.avatarConfig[6].img) document.getElementById('mascot').src = storeData.avatarConfig[6].img;
      }

      updateModalTotal();
      openModal('modal-buy');
    }

    function adjustQty(delta) {
      currentQty = Math.max(1, currentQty + delta);
      updateModalTotal();
    }

    function updateModalTotal() {
      document.getElementById('modal-qty').innerText = currentQty;
      const sel = document.getElementById('modal-variant-select');
      const unitUsdt = parseFloat(sel.value) || 0;
      const totalUsdt = unitUsdt * currentQty;
      const totalBs = (totalUsdt * storeData.tasaBs).toFixed(2);

      document.getElementById('modal-total-usdt').innerText = `${totalUsdt.toFixed(2)} USDT`;
      document.getElementById('modal-total-bs').innerText = `~ ${totalBs} BS`;
    }

    function confirmVipOrder() {
      const accountData = document.getElementById('client-account-data').value.trim();
      if (!accountData) return alert("Por favor ingresa los datos para procesar el pedido.");

      const sel = document.getElementById('modal-variant-select');
      const optName = sel.options[sel.selectedIndex].text;
      const unitUsdt = parseFloat(sel.value);
      const totalUsdt = unitUsdt * currentQty;
      const totalBs = (totalUsdt * storeData.tasaBs).toFixed(2);

      const text = `🌟 *PEDIDO JBstore VIP*\n\n📌 *Producto:* ${selectedProduct.titulo}\n🔹 *Opción:* ${optName}\n🔢 *Cantidad:* x${currentQty}\n💰 *Monto total:* ${totalUsdt.toFixed(2)} USDT / ${totalBs} BS\n\n👤 *Datos de la cuenta:*\n${accountData}`;
      
      window.open(`https://wa.me/${PHONE_NUMBER}?text=${encodeURIComponent(text)}`, '_blank');
      closeModal('modal-buy');
    }

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    /* PANEL ADMIN CON PESTAÑAS Y PRODUCTO AMPLIADO */
    function authAdmin() {
      if (document.getElementById('admin-pin').value === "24.07.12") {
        document.getElementById('admin-auth').style.display = 'none';
        document.getElementById('admin-body').style.display = 'block';
        document.getElementById('admin-tasa').value = storeData.tasaBs;

        if (storeData.avatarConfig) {
          storeData.avatarConfig.forEach((g, idx) => {
            if (document.getElementById(`avatar-img-${idx}`)) document.getElementById(`avatar-img-${idx}`).value = g.img || '';
            if (document.getElementById(`avatar-text-${idx}`)) document.getElementById(`avatar-text-${idx}`).value = g.text || '';
          });
        }
        filterAdminCategory('Juegos');
      } else { alert("PIN Incorrecto"); }
    }

    function filterAdminCategory(cat, element) {
      adminCategory = cat;
      if (element) {
        document.querySelectorAll('.admin-tab-btn').forEach(b => b.classList.remove('active'));
        element.classList.add('active');
      }
      populateAdminProductDropdown();
    }

    function populateAdminProductDropdown() {
      let sel = document.getElementById('edit-prod-select');
      sel.innerHTML = '<option value="NEW">➕ -- CREAR NUEVO PRODUCTO --</option>';
      const filtered = storeData.productos.filter(p => p.categoria === adminCategory);
      filtered.forEach(p => { sel.innerHTML += `<option value="${p.id}">✏️ ${p.titulo}</option>`; });
      loadProductToEdit();
    }

    function loadProductToEdit() {
      let selectedId = document.getElementById('edit-prod-select').value;
      let btnDelete = document.getElementById('btn-delete-prod');
      let btnSave = document.getElementById('btn-save-prod');

      if (selectedId === "NEW") {
        document.getElementById('prod-title').value = '';
        document.getElementById('prod-desc-short').value = '';
        document.getElementById('prod-desc-long').value = '';
        document.getElementById('prod-img-card').value = '';
        document.getElementById('prod-img-modal').value = '';
        document.getElementById('prod-variants').value = '';
        btnDelete.style.display = 'none';
        btnSave.innerText = "Guardar Producto";
      } else {
        let p = storeData.productos.find(prod => prod.id === selectedId);
        if (p) {
          document.getElementById('prod-title').value = p.titulo;
          document.getElementById('prod-desc-short').value = p.descShort || '';
          document.getElementById('prod-desc-long').value = p.descLong || '';
          document.getElementById('prod-img-card').value = p.imgCard || '';
          document.getElementById('prod-img-modal').value = p.imgModal || '';
          document.getElementById('prod-variants').value = p.variantes.map(v => `${v.nombre}:${v.usdt}`).join(', ');
          btnDelete.style.display = 'block';
          btnSave.innerText = "Actualizar Cambios";
        }
      }
    }

    function saveProduct() {
      let selectedId = document.getElementById('edit-prod-select').value;
      let title = document.getElementById('prod-title').value.trim();
      let descShort = document.getElementById('prod-desc-short').value.trim();
      let descLong = document.getElementById('prod-desc-long').value.trim();
      let imgCard = document.getElementById('prod-img-card').value.trim();
      let imgModal = document.getElementById('prod-img-modal').value.trim();
      let rawVar = document.getElementById('prod-variants').value.trim();

      if (!title || !rawVar) return alert("Ingresa el título y las variantes.");

      let vars = rawVar.split(',').map(v => {
        let [n, p] = v.split(':');
        return { nombre: n.trim(), usdt: parseFloat(p.trim()) };
      });

      if (selectedId === "NEW") {
        storeData.productos.push({
          id: Date.now().toString(),
          categoria: adminCategory,
          titulo: title,
          descShort,
          descLong,
          imgCard,
          imgModal,
          variantes: vars
        });
        alert("Producto creado exitosamente.");
      } else {
        let idx = storeData.productos.findIndex(p => p.id === selectedId);
        if (idx !== -1) {
          storeData.productos[idx] = {
            id: selectedId,
            categoria: adminCategory,
            titulo: title,
            descShort,
            descLong,
            imgCard,
            imgModal,
            variantes: vars
          };
          alert("Producto actualizado correctamente.");
        }
      }

      saveToStorage();
      populateAdminProductDropdown();
    }

    function deleteProduct() {
      let selectedId = document.getElementById('edit-prod-select').value;
      if (selectedId === "NEW") return;
      if (confirm("¿Estás seguro de eliminar este producto?")) {
        storeData.productos = storeData.productos.filter(p => p.id !== selectedId);
        saveToStorage();
        populateAdminProductDropdown();
        alert("Producto eliminado.");
      }
    }

    function saveGeneralSettings() {
      storeData.tasaBs = parseFloat(document.getElementById('admin-tasa').value) || storeData.tasaBs;
      saveToStorage();
      alert("Tasa actualizada.");
    }

    function saveAvatarSettings() {
      storeData.avatarConfig = [];
      for (let i = 0; i < 10; i++) {
        let imgInput = document.getElementById(`avatar-img-${i}`);
        let textInput = document.getElementById(`avatar-text-${i}`);
        if (imgInput && textInput) {
          let img = imgInput.value.trim();
          let text = textInput.value.trim();
          storeData.avatarConfig.push({ img, text });
        }
      }
      saveToStorage();
      talkMascot();
      alert("¡Se guardaron los 10 gestos del Avatar VIP con éxito!");
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(storeData, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `JBstore_VIP_Respaldo_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function triggerImport() { document.getElementById('import-file').click(); }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (imported && imported.productos) {
            storeData = imported;
            saveToStorage();
            talkMascot();
            alert("¡Respaldo restaurado con éxito!");
          } else { alert("El archivo no es un respaldo válido."); }
        } catch (err) { alert("Error al leer el archivo JSON."); }
      };
      reader.readAsText(file);
    }

    renderShop('Juegos');
  </script>
</body>
</html>
