<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JBstore VIP — Gacha Experience</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --accent-color: #10b981;
      --accent-hover: #059669;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --card-inner: #0f172a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 80px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      border-bottom: 2px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .logo-vip { font-size: 20px; font-weight: 900; color: var(--accent-color); letter-spacing: 1px; }
    .header-btns { display: flex; gap: 8px; align-items: center; }

    .sound-btn, .admin-btn {
      background: #1e293b;
      border: 2px solid var(--accent-color);
      color: var(--accent-color);
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .sound-btn:hover, .admin-btn:hover { background: var(--accent-color); color: #fff; }

    .app-layout {
      display: flex;
      flex: 1;
      max-width: 1100px;
      margin: 0 auto;
      width: 100%;
      padding: 16px;
      gap: 20px;
    }

    .sidebar {
      width: 300px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .character-container {
      position: relative;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 16px;
    }

    .dialogue-box {
      background: #ffffff;
      color: #0f172a;
      border: 2px solid var(--accent-color);
      border-radius: 16px;
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      position: relative;
      margin-bottom: 12px;
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.2);
      width: 100%;
      min-height: 55px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .dialogue-box::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 10px 10px 0;
      border-style: solid;
      border-color: #ffffff transparent;
      display: block;
      width: 0;
    }

    .character-img {
      width: 220px;
      height: 260px;
      object-fit: contain;
      cursor: pointer;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.4));
      transition: transform 0.15s ease-in-out;
    }
    .character-img:active { transform: scale(0.95); }

    .tabs-vertical {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .tab-item {
      padding: 12px 16px;
      background: #1e293b;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-main);
    }
    .tab-item.active {
      background: var(--accent-color);
      color: #ffffff;
      border-color: var(--accent-color);
      transform: translateX(6px);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    /* CONTENEDOR ESTILO TIENDA PELICAN FEELING */
    .shop-frame {
      flex: 1;
      background: rgba(30, 41, 59, 0.7);
      border: 2px solid var(--border-color);
      border-radius: 20px;
      padding: 16px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }

    .shop-header-timer {
      background: #0f172a;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--border-color);
    }

    .shop-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
    }

    /* TARJETA GACHA */
    .gacha-card {
      background: var(--card-inner);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }
    .gacha-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent-color);
    }

    .gacha-img-wrapper {
      position: relative;
      width: 100%;
      height: 110px;
      background: #1e293b;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .gacha-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .gacha-qty-badge {
      position: absolute;
      bottom: 4px;
      right: 4px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      font-size: 13px;
      font-weight: 900;
      padding: 1px 6px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }

    /* EFECTO DE TEXTO CAMINANTE (MARQUEE) SI EL TÍTULO ES LARGO */
    .gacha-title-wrapper {
      width: 100%;
      overflow: hidden;
      white-space: nowrap;
      margin-bottom: 2px;
      position: relative;
    }

    .gacha-title {
      font-size: 12px;
      font-weight: 800;
      color: #fff;
      display: inline-block;
      text-align: center;
      width: 100%;
    }

    /* Clase activa solo para títulos largos */
    .gacha-title-scroll {
      display: inline-block;
      padding-left: 100%;
      animation: marquee 8s linear infinite;
    }

    @keyframes marquee {
      0% { transform: translate(0, 0); }
      100% { transform: translate(-100%, 0); }
    }

    .gacha-subtitle {
      font-size: 10px;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-align: center;
    }

    .gacha-price-bar {
      width: 100%;
      background: linear-gradient(135deg, #059669 0%, #10b981 100%);
      color: #ffffff;
      padding: 6px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 900;
      text-align: center;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.2);
    }

    /* MODAL DE COMPRA */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .modal-gacha {
      background: #1e293b;
      border: 3px solid var(--accent-color);
      border-radius: 20px;
      max-width: 440px;
      width: 100%;
      padding: 20px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.5);
      color: #fff;
    }

    .modal-banner-img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 12px;
      border: 1px solid var(--border-color);
    }

    .field-group { margin-bottom: 12px; text-align: left; }
    .field-group label { display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; }

    select, input, textarea {
      width: 100%; padding: 10px; font-size: 13px;
      border: 1px solid var(--border-color); border-radius: 8px;
      background: #0f172a; color: #fff; outline: none;
    }

    .modal-qty-control {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin: 16px 0;
    }

    .qty-btn-gacha {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 2px solid var(--accent-color);
      background: #0f172a; color: var(--accent-color);
      font-size: 18px; font-weight: 900; cursor: pointer;
    }

    .buy-btn {
      width: 100%; padding: 12px;
      background: var(--accent-color); color: #fff;
      border: none; border-radius: 10px;
      font-weight: 800; cursor: pointer;
      transition: background 0.2s;
    }

    .admin-nav-tabs { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; }
    .admin-tab-btn {
      padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border-color);
      background: #0f172a; color: #fff; font-size: 11px; font-weight: 700; cursor: pointer;
    }
    .admin-tab-btn.active { background: var(--accent-color); border-color: var(--accent-color); }

    @media (max-width: 768px) {
      .app-layout { flex-direction: column; }
      .sidebar { width: 100%; }
      .character-img { height: 180px; }
      .tabs-vertical { flex-direction: row; overflow-x: auto; }
      .tab-item { flex: 0 0 auto; }
    }
  </style>
</head>
